# Nixpacks config for Dokploy: build with Vite, serve the static dist/ with Caddy.
# NOTE: do not add "caddy" to nixPkgs here. Nixpacks already installs caddy for
# Vite/SPA projects, and a second copy pulls in a second nixpkgs pin, which
# fails with a caddy-api.service file conflict.
[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "caddy run --config Caddyfile --adapter caddyfile"
